version: "3"

# Releases are explicit and local: `task release:check`, `task release`,
# `task release:resume`. CI never builds, signs, publishes or updates the tap.
# See docs/release-automation.md.

vars:
  RELTOOL_TAG: v0.4.1
  RELTOOL_COMMIT: e5dbed8034b899e5a7091ef1d3edf8e8da7989ab # commit of RELTOOL_TAG
  # Override with RELTOOL_SRC=<path> when release-tools is checked out elsewhere.
  RELTOOL_SRC: '{{.RELTOOL_SRC | default "../../../infrastructure/release-tools"}}'
  RELTOOL:
    sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/release-tools/{{.RELTOOL_COMMIT}}/reltool"

tasks:
  # --- app-owned recipes ---
  check:
    desc: The full local gate (lint, build, tests, security); CI runs the same tasks.
    cmds:
      - task: lint
      - task: build
      - task: test
      - task: security

  lint:
    desc: swift-format (strict), actionlint and shellcheck; all three are required.
    cmds:
      - swift format lint --strict --recursive Sources Tests
      - actionlint
      - shellcheck --severity=style scripts/*.sh

  format:
    desc: Rewrite Sources and Tests with swift-format.
    cmds:
      - swift format format --in-place --recursive Sources Tests

  warnings-as-errors:
    internal: true
    # Set project-wide in project.yml rather than on the xcodebuild command
    # line: a command-line override also reaches the MenubarKit package, whose
    # -suppress-warnings conflicts with -warnings-as-errors.
    preconditions:
      - sh: "grep -Eq '^    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES$' project.yml"
        msg: project.yml must set SWIFT_TREAT_WARNINGS_AS_ERRORS to YES in settings.base

  generate:
    internal: true
    # Not cached: XcodeGen globs Sources/ and Tests/, so new files must regenerate.
    cmds:
      - xcodegen generate

  build:
    desc: Generate the Xcode project and build the app (unsigned, warnings as errors).
    deps: [generate, warnings-as-errors]
    cmds:
      - >-
        xcodebuild
        -project usb-boop.xcodeproj
        -scheme usb-boop
        -destination 'platform=macOS,arch=arm64'
        CODE_SIGNING_ALLOWED=NO
        build

  test:
    desc: Run the unit and IOKit integration tests (unsigned) and enforce the coverage floors.
    deps: [generate, warnings-as-errors]
    vars:
      RESULT_BUNDLE: build/TestResults.xcresult
    cmds:
      - rm -rf {{.RESULT_BUNDLE}}
      - >-
        xcodebuild
        -project usb-boop.xcodeproj
        -scheme usb-boop
        -destination 'platform=macOS,arch=arm64'
        -enableCodeCoverage YES
        -resultBundlePath {{.RESULT_BUNDLE}}
        CODE_SIGNING_ALLOWED=NO
        test
      - ./scripts/check_coverage.sh {{.RESULT_BUNDLE}}

  screenshots:
    desc: Render the website screenshots from fixture data into docs/screenshots (MenubarKit PanelSnapshot).
    deps: [generate, warnings-as-errors]
    cmds:
      - mkdir -p docs/screenshots
      # xcodebuild passes TEST_RUNNER_-prefixed variables to the test runner without the prefix.
      - >-
        TEST_RUNNER_USB_BOOP_SCREENSHOTS="$PWD/docs/screenshots"
        xcodebuild
        -project usb-boop.xcodeproj
        -scheme usb-boop
        -destination 'platform=macOS,arch=arm64'
        -only-testing:USBBoopAppTests/ScreenshotTests
        CODE_SIGNING_ALLOWED=NO
        test

  security:
    desc: Check the sandbox, USB entitlement and Hardened Runtime invariants.
    cmds:
      - ./scripts/check_security.sh

  cask:lint:
    desc: Generate the Homebrew cask and lint it in a throwaway tap (uses brew).
    cmds:
      - ./scripts/lint_cask.sh

  build:darwin-arm64:
    desc: Build, sign and zip the app into $RELEASE_OUT (called by reltool).
    cmds:
      - ./scripts/build_release_zip.sh

  validate:darwin-arm64:
    desc: Verify the signed zip before notarization (called by reltool).
    cmds:
      - VERIFY_BEFORE_NOTARIZATION=1 ./scripts/verify_release_artifact.sh "$RELEASE_OUT/usb-boop-macos-arm64.zip" "$RELEASE_VERSION"

  # --- release-tools consumer snippet ---
  reltool:install:
    internal: true
    status:
      - test -x "{{.RELTOOL}}"
    cmds:
      # In cmds, not preconditions: an already-built reltool needs no checkout.
      - >-
        test -e "{{.RELTOOL_SRC}}/.git" || {
        echo "reltool: no release-tools checkout at {{.RELTOOL_SRC}}; clone alexcatdad/release-tools there or set RELTOOL_SRC=<path>" >&2;
        exit 1; }
      - git -C "{{.RELTOOL_SRC}}" show "{{.RELTOOL_COMMIT}}:scripts/install-reltool.sh" | sh -s -- "{{.RELTOOL_SRC}}" "{{.RELTOOL_TAG}}" "{{.RELTOOL_COMMIT}}"

  release:check:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release check --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:prepare:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release prepare --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release run --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:resume:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release resume --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:abandon:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release abandon {{.CLI_ARGS}}'
