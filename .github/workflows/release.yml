name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable release tag to verify and deliver
        required: true
        type: string

permissions: {}

# Serialize tap writes. A later release is rechecked before every push, and the
# current cask version prevents an older recovery run from downgrading users.
concurrency:
  group: release-homebrew-delivery
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify locally signed release
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      archive: ${{ steps.verify.outputs.archive }}

    steps:
      - name: Check out trusted verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate published release and source
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || {
            echo "Expected a vYYYY.MM.DD.N release tag." >&2
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false and .published_at != null' \
            release.json > /dev/null
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$latest" == "$RELEASE_TAG" ]] || {
            echo "Only the latest stable release can update Homebrew." >&2
            exit 1
          }
          git fetch origin main "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/main
          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify published artifact
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern usb-boop-macos-arm64.zip \
            --pattern usb-boop-macos-arm64.sha256 --dir assets
          # Validate the sidecar format before allowing it to select a file.
          [[ $(wc -l < assets/usb-boop-macos-arm64.sha256 | tr -d ' ') == 1 ]]
          LC_ALL=C grep -Eq '^[0-9a-f]{64}  usb-boop-macos-arm64\.zip$' \
            assets/usb-boop-macos-arm64.sha256
          (cd assets && shasum -a 256 -c usb-boop-macos-arm64.sha256)
          ./scripts/verify_release_artifact.sh assets/usb-boop-macos-arm64.zip "$VERSION"
          # ZIP remains the Homebrew artifact. When a DMG is offered too,
          # independently check its outer ticket and the identical app inside.
          if jq -e 'any(.assets[]; .name == "usb-boop-macos-arm64.dmg" or .name == "usb-boop-macos-arm64.dmg.sha256")' release.json > /dev/null; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern usb-boop-macos-arm64.dmg \
              --pattern usb-boop-macos-arm64.dmg.sha256 --dir assets
            [[ $(wc -l < assets/usb-boop-macos-arm64.dmg.sha256 | tr -d ' ') == 1 ]]
            LC_ALL=C grep -Eq '^[0-9a-f]{64}  usb-boop-macos-arm64\.dmg$' assets/usb-boop-macos-arm64.dmg.sha256
            (cd assets && shasum -a 256 -c usb-boop-macos-arm64.dmg.sha256)
            ./scripts/verify_dmg_artifact.sh assets/usb-boop-macos-arm64.dmg "$VERSION" assets/usb-boop-macos-arm64.zip
          fi
          echo "archive=$(shasum -a 256 assets/usb-boop-macos-arm64.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: verify-release
    environment: action-runners

    steps:
      - name: Download the verified release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-release.outputs.tag }}
          VERIFIED_SHA: ${{ needs.verify-release.outputs.archive }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern usb-boop-macos-arm64.zip --dir assets
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$VERIFIED_SHA" assets/usb-boop-macos-arm64.zip | sha256sum -c -

      - name: Check out usb-boop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Get GitHub App user ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      # Credentials are persisted deliberately for the final tap commit/push.
      - name: Check out homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap

      - name: Reject tap version downgrade
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]
          if [[ -f homebrew-tap/Casks/usb-boop.rb ]]; then
            current=$(sed -n 's/^  version "\([^"]*\)"$/\1/p' homebrew-tap/Casks/usb-boop.rb)
            [[ "$current" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]
            newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)
            [[ "$newest" == "$VERSION" ]] || {
              echo "Refusing to downgrade the Homebrew cask." >&2
              exit 1
            }
          fi

      - name: Update cask
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
          SHA_ARCHIVE: ${{ needs.verify-release.outputs.archive }}
        run: |
          ./scripts/update_homebrew_tap.sh \
            homebrew-tap "$VERSION" "$SHA_ARCHIVE" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v${VERSION}/usb-boop-macos-arm64.zip"

      - name: Update README
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          TABLE=$'| Formula | Version | Description |\n|---------|---------|-------------|'
          if [ -d homebrew-tap/Formula ]; then
            for rb in homebrew-tap/Formula/*.rb; do
              [ -e "$rb" ] || continue
              name=$(basename "$rb" .rb)
              ver=$(grep -m1 'version "' "$rb" | sed 's/.*version "//;s/".*//')
              desc=$(grep -m1 'desc "' "$rb" | sed 's/.*desc "//;s/".*//')
              TABLE="${TABLE}"$'\n'"| [${name}](https://github.com/${OWNER}/${name}) | ${ver} | ${desc} |"
            done
          fi
          if [ -d homebrew-tap/Casks ]; then
            for rb in homebrew-tap/Casks/*.rb; do
              [ -e "$rb" ] || continue
              name=$(basename "$rb" .rb)
              ver=$(grep -m1 'version "' "$rb" | sed 's/.*version "//;s/".*//')
              desc=$(grep -m1 'desc "' "$rb" | sed 's/.*desc "//;s/".*//')
              TABLE="${TABLE}"$'\n'"| [${name}](https://github.com/${OWNER}/${name}) | ${ver} | ${desc} (cask) |"
            done
          fi

          INSTALL=$'```bash\n'
          if [ -d homebrew-tap/Formula ]; then
            for rb in homebrew-tap/Formula/*.rb; do
              [ -e "$rb" ] || continue
              name=$(basename "$rb" .rb)
              INSTALL="${INSTALL}brew install ${OWNER}/tap/${name}"$'\n'
            done
          fi
          if [ -d homebrew-tap/Casks ]; then
            for rb in homebrew-tap/Casks/*.rb; do
              [ -e "$rb" ] || continue
              name=$(basename "$rb" .rb)
              INSTALL="${INSTALL}brew install --cask ${OWNER}/tap/${name}"$'\n'
            done
          fi
          INSTALL="${INSTALL}"$'```\n'

          awk -v table="$TABLE" -v install="$INSTALL" '
            /<!-- BEGIN FORMULAE -->/ { print; printf "%s\n", table; skip=1; next }
            /<!-- END FORMULAE -->/ { skip=0 }
            skip { next }
            /<!-- BEGIN INSTALL -->/ { print; printf "%s\n", install; skip2=1; next }
            /<!-- END INSTALL -->/ { skip2=0 }
            skip2 { next }
            { print }
          ' homebrew-tap/README.md > homebrew-tap/README.tmp && mv homebrew-tap/README.tmp homebrew-tap/README.md

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-release.outputs.tag }}
          VERSION: ${{ needs.verify-release.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$latest" == "$TAG" ]] || {
            echo "A newer stable release is available; refusing a stale tap update." >&2
            exit 1
          }
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Casks/usb-boop.rb README.md
          git diff --staged --quiet || {
            git commit -m "chore: update usb-boop to ${VERSION}"
            git push
          }
