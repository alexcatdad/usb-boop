name: usb-boop

options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true

packages:
  # menubar-kit v2026.11.07.2. SwiftPM cannot resolve four-part CalVer tags, so
  # the tag's commit is pinned by revision. Linked statically into the app only.
  MenubarKit:
    url: https://github.com/alexcatdad/menubar-kit.git
    revision: cf3666e8e1a822930c7f4c3f64309de5951b1c54

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    SUPPORTED_PLATFORMS: macosx
    SDKROOT: macosx
    ARCHS: arm64
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  USBBoopKit:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/USBBoopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexcatdad.usb-boop.kit
        PRODUCT_NAME: USBBoopKit
        GENERATE_INFOPLIST_FILE: YES

  usb-boop:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/App
      - path: Sources/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: USBBoopKit
      - package: MenubarKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexcatdad.usb-boop
        PRODUCT_NAME: usb-boop
        PRODUCT_MODULE_NAME: USBBoopApp
        INFOPLIST_FILE: Sources/App/Info.plist
        # Hardened Runtime is applied at signing time, not here: it enables
        # library validation, which an ad-hoc signature cannot satisfy for the
        # embedded USBBoopKit.framework. See scripts/build_release_zip.sh.
        CODE_SIGN_ENTITLEMENTS: Sources/App/usb-boop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Keep TrayIcon/USBBoopTrayIcon.png and @2x.png as separate files:
        # MenubarKit's TrayIconLoader loads both and rejects a merged TIFF.
        COMBINE_HIDPI_IMAGES: NO
        MARKETING_VERSION: 0.0.0-dev
        CURRENT_PROJECT_VERSION: 1
      configs:
        Debug:
          PRODUCT_NAME: usb-boop-dev
          PRODUCT_BUNDLE_IDENTIFIER: com.alexcatdad.usb-boop.dev

  USBBoopKitTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/USBBoopKitTests
    dependencies:
      - target: USBBoopKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  USBBoopAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/USBBoopAppTests
      - path: Sources/App
        includes:
          - "*.swift"
        excludes:
          - USBBoopApp.swift
    dependencies:
      - target: USBBoopKit
      - package: MenubarKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  usb-boop:
    build:
      targets:
        usb-boop: all
        USBBoopKit: all
    test:
      targets:
        - USBBoopKitTests
        - USBBoopAppTests
